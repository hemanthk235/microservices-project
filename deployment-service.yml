apiVersion: v1
kind: Namespace
metadata:
  name: webapps
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: currencyservice
  template:
    metadata:
      labels:
        app: currencyservice
    spec:
      containers:
      - name: server
        image: hemanthk235/currencyservice:latest
        ports:
        - containerPort: 7000
        env:
        - name: PORT
          value: "7000"
---
apiVersion: v1
kind: Service
metadata:
  name: currencyservice
  namespace: webapps
spec:
  selector:
    app: currencyservice
  ports:
  - port: 7000
    targetPort: 7000
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      containers:
      - name: server
        image: hemanthk235/productcatalogservice:latest
        ports:
        - containerPort: 3550
        env:
        - name: PORT
          value: "3550"
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: webapps
spec:
  selector:
    app: productcatalogservice
  ports:
  - port: 3550
    targetPort: 3550
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      containers:
      - name: server
        image: hemanthk235/cartservice:latest
        ports:
        - containerPort: 7070
        env:
        - name: REDIS_ADDR
          value: "redis-cart:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: webapps
spec:
  selector:
    app: cartservice
  ports:
  - port: 7070
    targetPort: 7070
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: webapps
spec:
  selector:
    app: redis-cart
  ports:
  - port: 6379
    targetPort: 6379
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
      - name: server
        image: hemanthk235/paymentservice:latest
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        - name: ENABLE_PROFILER
          value: "false"
        - name: GOOGLE_CLOUD_PROJECT
          value: "local-dev"
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: webapps
spec:
  selector:
    app: paymentservice
  ports:
  - port: 50051
    targetPort: 50051
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      containers:
      - name: server
        image: hemanthk235/shippingservice:latest
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  namespace: webapps
spec:
  selector:
    app: shippingservice
  ports:
  - port: 50051
    targetPort: 50051
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      containers:
      - name: server
        image: hemanthk235/emailservice:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: webapps
spec:
  selector:
    app: emailservice
  ports:
  - port: 5000
    targetPort: 8080
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      containers:
      - name: server
        image: hemanthk235/recommendationservice:latest
        ports:
        - containerPort: 8080
        env:
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  namespace: webapps
spec:
  selector:
    app: recommendationservice
  ports:
  - port: 8080
    targetPort: 8080
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: webapps
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: server
        image: hemanthk235/frontend:latest
        ports:
        - containerPort: 8080
        env:
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: CURRENCY_SERVICE_ADDR
          value: "currencyservice:7000"
        - name: CART_SERVICE_ADDR
          value: "cartservice:7070"
        - name: RECOMMENDATION_SERVICE_ADDR
          value: "recommendationservice:8080"
        - name: SHIPPING_SERVICE_ADDR
          value: "shippingservice:50051"
        - name: CHECKOUT_SERVICE_ADDR
          value: "checkoutservice:5050"
        - name: AD_SERVICE_ADDR
          value: "adservice:9555"
        - name: ENABLE_PROFILER
          value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: webapps
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 8080
